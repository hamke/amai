<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoMoney AI Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen p-8">
    <h1 class="text-3xl text-center font-bold mb-8">AutoMoney AI Admin</h1>

    <div id="dashboard"></div>

    <script src="./services.js"></script>

    <script>
      const domainType =
        location.hostname === "localhost" ? "url_localhost" : "url_external";

      const dashboard = document.getElementById("dashboard");

      const categories = [...new Set(services.map((s) => s.category))];

      categories.forEach((category) => {
        const section = document.createElement("section");
        section.className = "mb-12";

        const title = document.createElement("h2");
        title.className = "text-xl font-semibold mb-4";
        title.textContent = category;

        const grid = document.createElement("div");
        grid.className = "grid grid-cols-1 md:grid-cols-3 gap-4";

        services
          .filter((s) => s.category === category)
          .forEach((service) => {
            const card = document.createElement("div");
            card.className =
              "border p-4 rounded shadow hover:shadow-lg bg-white";

            const h3 = document.createElement("h3");
            h3.className = "text-lg font-bold mb-2";
            h3.textContent = service.name;

            const linkList = document.createElement("ul");
            linkList.className = "space-y-1";

            for (const [linkType, links] of Object.entries(service.links)) {
              links.forEach((link) => {
                const li = document.createElement("li");

                const a = document.createElement("a");
                a.href = link[domainType];
                a.textContent = `${linkType}`;
                a.className =
                  "text-blue-600 hover:underline text-sm inline-block";
                a.target = "_blank";

                li.appendChild(a);
                linkList.appendChild(li);
              });
            }

            card.appendChild(h3);
            card.appendChild(linkList);

            grid.appendChild(card);
          });

        section.appendChild(title);
        section.appendChild(grid);
        dashboard.appendChild(section);
      });
    </script>
  </body>
</html>
