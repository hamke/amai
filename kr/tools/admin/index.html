<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <meta name="robots" content="noindex, nofollow">
    <title>AutoMoney AI Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 640px;
        }

        #clearBtn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            color: #999;
            display: none;
            user-select: none;
        }

        #clearBtn:hover {
            color: #333;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen px-4 py-4">
    <h1 class="text-xl lg:text-2xl text-center font-bold mb-4">
        <a href="./">
            AutoMoney AI Admin
        </a>
    </h1>

    <div class="flex justify-center mb-6">
        <div class="search-wrapper w-full">
            <input type="text" id="searchInput" placeholder="Input a keyword ..."
                class="border rounded p-2 w-full pr-8 focus:outline-none" />
            <span id="clearBtn" title="Clear search">X</span>
        </div>
        <button id="searchButton" class="ml-2 bg-blue-600 text-white px-4 rounded hover:bg-blue-700">
            Search
        </button>
    </div>

    <button id="menuButton" class="fixed top-4 left-4 z-50 px-2 py-1 focus:outline-none" aria-label="Toggle menu">

        <svg id="menuIcon" class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" stroke-width="2"
            viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="18" x2="21" y2="18" />
        </svg>

        <svg id="closeIcon" class="w-5 h-5 text-gray-700 hidden" fill="none" stroke="currentColor" stroke-width="2"
            viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
    </button>

    <div id="offCanvasMenu"
        class="fixed top-0 left-0 h-full w-64 bg-white shadow-lg transform -translate-x-full transition-transform duration-300 ease-in-out z-40"
        aria-hidden="true">
        <div class="pb-5 mb-5 flex justify-between items-center" style="padding-bottom:2.5rem;">
        </div>
        <nav class="px-3 py-5 text-center">
            <ul class="space-y-4 text-gray-700">
                <li>
                    <a href="./" class="hover:text-blue-600">
                        Home
                    </a>
                </li>
                <li>
                    <a href="./../../kakao/" target="_blank" class="hover:text-blue-600">
                        Kakao
                    </a>
                </li>
            </ul>
        </nav>
    </div>

    <div id="overlay"
        class="fixed inset-0 bg-black bg-opacity-30 opacity-0 pointer-events-none transition-opacity duration-300 z-30">
    </div>

    <div id="languageSelector" class="fixed top-4 right-4 z-50">
        <button id="langBtn" class="px-2 py-1 flex items-center space-x-1 focus:outline-none" aria-haspopup="true"
            aria-expanded="false" title="Select Language">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-700" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <path d="M2 12h20M12 2a15.3 15.3 0 010 20M12 2a15.3 15.3 0 010 20" />
            </svg>
            <!-- <span id="selectedLang" class="text-sm font-semibold select-none">KO</span> -->
            <!-- <svg class="w-4 h-4 text-gray-700" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg> -->
        </button>
        <ul id="langMenu" class="hidden absolute right-0 mt-1 w-32 bg-white border border-gray-300 rounded shadow-md">
            <li><button class="w-full text-left px-3 py-1 hover:bg-blue-100" data-lang="EN">English</button></li>
            <li><button class="w-full text-left px-3 py-1 hover:bg-blue-100" data-lang="KO">한국어</button></li>
            <li><button class="w-full text-left px-3 py-1 hover:bg-blue-100" data-lang="ZH-CN">中文(简体)</button></li>
            <li><button class="w-full text-left px-3 py-1 hover:bg-blue-100" data-lang="ZH-TW">中文(繁體)</button></li>
            <li><button class="w-full text-left px-3 py-1 hover:bg-blue-100" data-lang="JA">日本語</button></li>
            <li><button class="w-full text-left px-3 py-1 hover:bg-blue-100" data-lang="VI">Tiếng Việt</button></li>
        </ul>
    </div>

    <div id="dashboard"></div>

    <button id="scrollTopBtn"
        class="fixed bottom-6 right-6 p-2 rounded-full bg-blue-600 text-white shadow-lg hover:bg-blue-700 focus:outline-none z-50"
        title="위로 가기" aria-label="Scroll to top">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M12 19V6m0 0l-7 7m7-7l7 7" />
        </svg>
    </button>

    <script src="./assets/js/data.js"></script>

    <script>
        const domainType = location.hostname === "localhost" ? "url_localhost" : "url_external";
        const dashboard = document.getElementById("dashboard");
        const searchInput = document.getElementById("searchInput");
        const searchButton = document.getElementById("searchButton");
        const clearBtn = document.getElementById("clearBtn");

        function renderDashboard(filterText = "") {
            dashboard.innerHTML = "";

            const lowerFilter = filterText.toLowerCase();

            const filteredServices = filterText
                ? services.filter(s => {
                    const inName = s.name.toLowerCase().includes(lowerFilter);
                    const inLinkKeys = Object.keys(s.links).some(linkKey =>
                        linkKey.toLowerCase().includes(lowerFilter)
                    );

                    return inName || inLinkKeys;
                })
                : services;

            const categories = [...new Set(filteredServices.map(s => s.category))];

            categories.forEach(category => {
                const section = document.createElement("section");
                section.className = "mb-12";

                const title = document.createElement("h2");
                title.className = "text-xl font-semibold mb-4";
                title.textContent = category;

                const grid = document.createElement("div");
                grid.className = "grid grid-cols-1 md:grid-cols-3 gap-4";

                filteredServices
                    .filter(s => s.category === category)
                    .forEach(service => {
                        const card = document.createElement("div");
                        card.className = "border p-4 rounded shadow hover:shadow-lg bg-white";

                        const h3 = document.createElement("h3");
                        h3.className = "text-lg font-bold mb-2";
                        h3.textContent = service.name;

                        card.appendChild(h3);

                        if (service.links.main) {
                            service.links.main.forEach(link => {
                                const mainDiv = document.createElement("div");
                                mainDiv.className = "main-link mb-2";

                                const a = document.createElement("a");
                                a.href = link[domainType];
                                a.textContent = service.id;
                                a.className = "text-blue-600 hover:underline text-sm inline-block";
                                a.target = "_blank";

                                mainDiv.appendChild(a);
                                card.appendChild(mainDiv);
                            });
                        }

                        const otherLinksDiv = document.createElement("div");
                        otherLinksDiv.className = "text-sm mt-1";

                        const otherLinkEntries = Object.entries(service.links).filter(([key]) => key !== "main");

                        const otherLinks = [];
                        otherLinkEntries.forEach(([linkType, links]) => {
                            links.forEach(link => {
                                otherLinks.push({
                                    text: linkType,
                                    href: link[domainType],
                                });
                            });
                        });

                        otherLinks.forEach((linkObj, idx) => {
                            const a = document.createElement("a");
                            a.href = linkObj.href;
                            a.textContent = linkObj.text;
                            a.className = "text-blue-600 hover:underline";
                            a.target = "_blank";
                            otherLinksDiv.appendChild(a);

                            if (idx < otherLinks.length - 1) {
                                otherLinksDiv.appendChild(document.createTextNode(" / "));
                            }
                        });

                        if (otherLinks.length > 0) {
                            card.appendChild(otherLinksDiv);
                        }

                        grid.appendChild(card);
                    });

                section.appendChild(title);
                section.appendChild(grid);
                dashboard.appendChild(section);
            });
        }

        function toggleClearBtn() {
            clearBtn.style.display = searchInput.value.trim() ? "block" : "none";
        }

        searchInput.addEventListener("input", () => {
            toggleClearBtn();
            renderDashboard(searchInput.value);
        });

        searchButton.addEventListener("click", () => {
            renderDashboard(searchInput.value);
            toggleClearBtn();
        });

        searchInput.addEventListener("keypress", e => {
            if (e.key === "Enter") {
                renderDashboard(searchInput.value);
                toggleClearBtn();
            }
        });

        clearBtn.addEventListener("click", () => {
            searchInput.value = "";
            toggleClearBtn();
            renderDashboard();
            searchInput.focus();
        });

        toggleClearBtn();
        renderDashboard();
    </script>

    <script>
        const menuButton = document.getElementById("menuButton");
        const menuIcon = document.getElementById("menuIcon");
        const closeIcon = document.getElementById("closeIcon");
        const offCanvasMenu = document.getElementById("offCanvasMenu");
        const overlay = document.getElementById("overlay");

        function openMenu() {
            offCanvasMenu.classList.remove("-translate-x-full");
            offCanvasMenu.setAttribute("aria-hidden", "false");
            overlay.classList.remove("opacity-0", "pointer-events-none");
            menuIcon.classList.add("hidden");
            closeIcon.classList.remove("hidden");
        }

        function closeMenu() {
            offCanvasMenu.classList.add("-translate-x-full");
            offCanvasMenu.setAttribute("aria-hidden", "true");
            overlay.classList.add("opacity-0", "pointer-events-none");
            menuIcon.classList.remove("hidden");
            closeIcon.classList.add("hidden");
        }

        menuButton.addEventListener("click", () => {
            const isOpen = !offCanvasMenu.classList.contains("-translate-x-full");
            if (isOpen) {
                closeMenu();
            } else {
                openMenu();
            }
        });

        overlay.addEventListener("click", closeMenu);
    </script>

    <script>
        const langBtn = document.getElementById("langBtn");
        const langMenu = document.getElementById("langMenu");
        const selectedLang = document.getElementById("selectedLang");

        langBtn.addEventListener("click", () => {
            const isHidden = langMenu.classList.contains("hidden");
            if (isHidden) {
                langMenu.classList.remove("hidden");
                langBtn.setAttribute("aria-expanded", "true");
            } else {
                langMenu.classList.add("hidden");
                langBtn.setAttribute("aria-expanded", "false");
            }
        });

        langMenu.querySelectorAll("button").forEach(btn => {
            btn.addEventListener("click", () => {
                const langCode = btn.getAttribute("data-lang");
                selectedLang.textContent = langCode;
                langMenu.classList.add("hidden");
                langBtn.setAttribute("aria-expanded", "false");

                console.log("Selected language:", langCode);
            });
        });

        document.addEventListener("click", (e) => {
            if (!langBtn.contains(e.target) && !langMenu.contains(e.target)) {
                langMenu.classList.add("hidden");
                langBtn.setAttribute("aria-expanded", "false");
            }
        });
    </script>

    <script>
        const scrollTopBtn = document.getElementById('scrollTopBtn');

        window.addEventListener('scroll', () => {
            if (window.scrollY > 100) {
                scrollTopBtn.classList.remove('hidden');
            } else {
                scrollTopBtn.classList.add('hidden');
            }
        });

        scrollTopBtn.classList.add('hidden');

        scrollTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>

    <script>
        document.addEventListener("keydown", (e) => {
            if (e.key === "/" && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) {
                e.preventDefault();
                searchInput.focus();
            }
        });
    </script>
</body>

</html>
