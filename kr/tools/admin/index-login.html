<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <meta name="robots" content="noindex, nofollow">
    <title>Login - AutoMoney AI Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
    :root {
        --color-background: #0a0a0c;
        --color-background-light: #19191a;
        --color-background-dark: #000;
        --color-primary: #8b5cf6;
        --color-primary-dark: #7645e3;
        --color-border: #19191a;
        --color-text-h1: #fff;
        --color-text-h2: #f3f3f3;
        --color-text-h3: #ecedee;
        --color-text-content: #a1a1aa;
        --color-text-other: #d2d2d2;
        --color-muted: #7c7c7c;
    }
    </style>
</head>

<body class="bg-gray-50 flex items-center justify-center min-h-screen px-4 text-center">

    <form action="" method="post" name="Login_Form" class="bg-white rounded-lg shadow-md p-8 max-w-md w-full">
        <a href="./" class="inline-block mb-6">
            <img src="https://hellotblog.wordpress.com/wp-content/uploads/2025/07/automoneytalk-logo-design-img-round-01-80x80-1.png"
                alt="logo" width="72" height="72" class="mx-auto" />
        </a>

        <h1 class="text-2xl font-bold mb-6">AutoMoney AI Admin</h1>

        <label for="inputusername" class="sr-only">Username</label>
        <input name="username" type="text" id="inputusername" placeholder="Username" required autofocus
            class="appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 mb-4" />

        <label for="inputpassword" class="sr-only">Password</label>
        <input name="password" type="password" id="inputpassword" placeholder="Password" required
            class="appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 mb-4" />

        <input name="human-check" type="text" id="human-check" class="hidden" />

        <div class="flex items-center justify-between mb-4">
            <label class="inline-flex items-center text-gray-700 text-sm select-none">
                <input type="checkbox" class="form-checkbox text-indigo-600" value="remember-me" />
                <span class="ml-2">Remember me</span>
            </label>
        </div>

        <button name="Submit" value="Login" type="submit"
            class="w-full bg-gray-800 hover:bg-gray-700 text-white font-semibold py-3 rounded-md transition focus:outline-none focus:ring-2 focus:ring-gray-800">
            Sign in
        </button>

        <div id="errorMessage" class="mt-4 text-gray-800 text-sm hidden">
            <!-- ... -->
        </div>

        <p class="mt-8 text-gray-500 text-sm">&copy; AutoMoney AI</p>
    </form>

</body>

</html>
