            text-decoration: none;
        }

        }

        .menu-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 36px;
            /* gap: 8px; */
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: none;
            border: none;
            z-index: 9999;
            cursor: pointer;
        }

        .menu-btn span {
            display: block;
            height: 2px;
            width: 100%;
            background-color: var(--color-text-h1);
            border-radius: 2px;
            transition: all 0.4s ease;
        }

        .menu-btn:hover span {
            background-color: var(--color-primary);
        }

        .menu-btn span+span {
            margin-top: 8px;
        }

        .menu-btn.active span:nth-child(1) {
            transform: rotate(45deg) translate(10px, 4px);
            width: 100%;
        }

        .menu-btn.active span:nth-child(2) {
            opacity: 0;
        }

        .menu-btn.active span:nth-child(3) {
            transform: rotate(-45deg) translate(10px, -4px);
            width: 100%;
        }

        /* Off-canvas menu */
        .offcanvas-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--color-background-light);
            opacity: 0;
            visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            z-index: 9998;
        }

        .offcanvas-menu.show {

            visibility: visible;
        }

        .offcanvas-menu nav ul {

            }

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const ctx = document.getElementById('myChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['월', '화', '수', '목', '금', '토', '일'],
                    datasets: [{
                        label: '수익 (₩)',
                        data: [120, 190, 300, 250, 320, 280, 400],
                        borderColor: getComputedStyle(document.documentElement).getPropertyValue('--color-muted').trim(),
                        backgroundColor: 'transparent',
                        borderWidth: 2,
                        pointRadius: 0,
                        tension: 0.4,
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: {
                                color: getComputedStyle(document.documentElement).getPropertyValue('--color-text-content').trim(),
                                font: { family: 'Pretendard' }
                            }
                        },
                        y: {
                            grid: { display: false },
                            ticks: {
                                color: getComputedStyle(document.documentElement).getPropertyValue('--color-text-content').trim(),
                                font: { family: 'Pretendard' }
                            }
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        });

        document.addEventListener("DOMContentLoaded", () => {
            document.querySelector("main").style.opacity = "1";
        });

        document.addEventListener("DOMContentLoaded", () => {
            const menuBtn = document.getElementById('menu-toggle');
            const offcanvas = document.getElementById('offcanvas-menu');

            menuBtn.addEventListener('click', () => {
                if (!offcanvas.classList.contains('show')) {
                    menuBtn.classList.add('active');
                    offcanvas.classList.add('show');
                } else {
                    offcanvas.style.opacity = "0";
                    menuBtn.classList.remove('active');
                    setTimeout(() => {
                        offcanvas.classList.remove('show');
                        offcanvas.style.opacity = "";
                    }, 500);
                }
            });

            document.querySelectorAll('.offcanvas-menu a').forEach(link => {
                link.addEventListener('click', () => {
                    offcanvas.style.opacity = "0";
                    menuBtn.classList.remove('active');
                    setTimeout(() => {
                        offcanvas.classList.remove('show');
                        offcanvas.style.opacity = "";
                    }, 500);
                });
            });
        });
    </script>

    <script>
        const mouse_circle = document.querySelector(".mouse-circle");

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;

        let currentX = mouseX;
        let currentY = mouseY;

        document.addEventListener("mousemove", (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function mouse_animate() {
            currentX += (mouseX - currentX) * 0.25;
            currentY += (mouseY - currentY) * 0.25;

            mouse_circle.style.left = currentX + 5 + "px";
            mouse_circle.style.top = currentY + 10 + "px";

            requestAnimationFrame(mouse_animate);
        }

        mouse_animate();
    </script>
